---
name: Telemt
version: "0.1.6"
slug: telemt
description: Telemt MTProto WEB proxy for Telegram, behind Caddy/NGINX TLS termination
url: https://github.com/ad/ha-telemt
arch:
  - aarch64
  - amd64
startup: services
init: false
host_network: false
ingress: true
ingress_port: 8099
panel_icon: mdi:send-lock
panel_title: Telemt
ports:
  "18080/tcp": 18080
ports_description:
  "18080/tcp": Plain HTTP WEB listener, keep it behind a TLS terminator
options:
  host: proxy.example.com
  public_ip: ""
  secret: ""
  carrier: https-lanes
  telemt_log_level: normal
  trusted_proxy_cidrs:
    - 172.30.32.0/23
  socks5_upstream: ""
  decoy_upstream: ""
  decoy_html: ""
schema:
  host: "str"
  public_ip: "str?"
  secret: "match(^((dd)?[0-9a-fA-F]{32})?$)?"
  carrier: "list(https|https-lanes)?"
  telemt_log_level: "list(debug|verbose|normal|silent)?"
  trusted_proxy_cidrs:
    - "str"
  socks5_upstream: "str?"
  decoy_upstream: "str?"
  decoy_html: "str?"
